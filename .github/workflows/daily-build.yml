name: Daily 60s Build

on:
  push:
  schedule:
    # 北京时间5点 (UTC 21:00)
    - cron: '0 21 * * *'
    # 北京时间6点 (UTC 22:00)
    - cron: '0 22 * * *'
    # 北京时间7点 (UTC 23:00)
    - cron: '0 23 * * *'
    # 北京时间8点 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if today's data already built
        id: date_check
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          echo "today_bjt=$TODAY" >> $GITHUB_OUTPUT
          SKIP=false
          if [ -f zhihu_daily_news.xml ]; then
            DATE_STR=$(grep -m1 'pubDate' zhihu_daily_news.xml | grep -oP '\d{1,2} \w{3} \d{4}' || true)
            XML_DATE=$(TZ='Asia/Shanghai' date -d "$DATE_STR" +'%Y-%m-%d' 2>/dev/null || echo "none")
            echo "XML date: $XML_DATE"
            if [ "$XML_DATE" = "$TODAY" ]; then
              SKIP=true
              echo "Today's data ($TODAY) already exists, skipping build"
            else
              echo "Need to build for $TODAY (current XML: $XML_DATE)"
            fi
          else
            echo "No XML found, will build"
          fi
          echo "skip=$SKIP" >> $GITHUB_OUTPUT

      - name: Setup Python
        if: steps.date_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (Chrome headless + Chinese fonts)
        if: steps.date_check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libgbm1 libnss3 libatk-bridge2.0-0 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 fonts-noto-cjk 2>&1 | tail -5

      - name: Install Python dependencies
        if: steps.date_check.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts selenium webdriver-manager Pillow

      - name: Setup Chrome
        if: steps.date_check.outputs.skip != 'true'
        uses: browser-actions/setup-chrome@v1

      - name: Run 60s pipeline (RSS + TTS + WebP)
        if: steps.date_check.outputs.skip != 'true'
        run: |
          echo "=== 执行每日构建 $(TZ='Asia/Shanghai' date) ==="
          python sixty_seconds_daily.py
          echo "=== XML 内容预览 ==="
          head -20 zhihu_daily_news.xml

      - name: Commit and push changes
        if: steps.date_check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f zhihu_daily_news.xml 60s.mp3 60s.webp 60s.html index.html 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TODAY=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
            git commit -m "Daily build: $TODAY [skip ci]"
            git push
            echo "Pushed changes for $TODAY"
          fi
