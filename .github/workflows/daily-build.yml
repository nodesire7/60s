name: Daily 60s Build

on:
  push:
    branches: [main]
  schedule:
    # 北京时间 06:40–12:40，每 20 分钟检查一次。
    # 上游（vikiboss/60s）一般在早上发布，未发布时本次直接跳过，发布后 20 分钟内完成更新。
    # 注意：cron 的小时范围必须递增，跨零点要拆成两条。
    - cron: '*/20 22-23 * * *'   # 北京时间 06:40–07:40
    - cron: '*/20 0-4 * * *'     # 北京时间 08:00–12:40
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个构建，避免定时任务与手动触发互相覆盖
concurrency:
  group: daily-60s-build
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check today's data status
        id: date_check
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          BUILT=$(cat data-date.txt 2>/dev/null | tr -d '\r\n ' || true)
          echo "today_bjt=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "$BUILT" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今日（$TODAY）数据已生成，跳过构建"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "当前数据日期: ${BUILT:-none}，需要构建 $TODAY"
          fi

      - name: Setup Python
        if: steps.date_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (Chrome headless + Chinese fonts)
        if: steps.date_check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libgbm1 libnss3 libatk-bridge2.0-0 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 fonts-noto-cjk 2>&1 | tail -5

      - name: Install Python dependencies
        if: steps.date_check.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts selenium webdriver-manager Pillow

      - name: Setup Chrome
        if: steps.date_check.outputs.skip != 'true'
        uses: browser-actions/setup-chrome@v1

      - name: Run 60s pipeline (RSS + TTS + WebP)
        id: build
        if: steps.date_check.outputs.skip != 'true'
        run: |
          echo "=== 执行每日构建 $(TZ='Asia/Shanghai' date '+%F %T %Z') ==="
          set +e
          python sixty_seconds_daily.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          if [ "$code" -eq 3 ]; then
            # 上游还没发布今天的新闻，不算失败
            HOUR=$(TZ='Asia/Shanghai' date +%H)
            if [ "$HOUR" -ge 12 ]; then
              echo "::error::已过北京时间 12:00，上游仍未发布今日数据，请检查数据源"
              exit 1
            fi
            echo "::notice::上游尚未发布今日数据，等待下一次调度"
            exit 0
          fi

          if [ "$code" -ne 0 ]; then
            echo "::error::构建脚本失败，退出码 $code"
            exit "$code"
          fi

          echo "=== XML 内容预览 ==="
          head -12 zhihu_daily_news.xml

      - name: Verify today's data
        if: steps.date_check.outputs.skip != 'true' && steps.build.outputs.exit_code == '0'
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          BUILT=$(cat data-date.txt 2>/dev/null || echo none)
          echo "数据日期: $BUILT / 今天: $TODAY"
          if [ "$BUILT" != "$TODAY" ]; then
            echo "::error::构建结果不是今日数据（$BUILT），拒绝提交"
            exit 1
          fi
          for f in 60s.mp3 60s.webp 60s.html index.html; do
            if [ ! -s "$f" ]; then
              echo "::error::缺少产物文件 $f"
              exit 1
            fi
          done

      - name: Commit and push changes
        if: steps.date_check.outputs.skip != 'true' && steps.build.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f zhihu_daily_news.xml data-date.txt 60s.mp3 60s.webp 60s.html index.html

          if git diff --staged --quiet; then
            echo "内容无变化，无需提交"
            exit 0
          fi

          TODAY=$(TZ='Asia/Shanghai' date +'%F %H:%M')
          git commit -m "Daily build: $TODAY [skip ci]"
          git pull --rebase --autostash origin main
          git push
          echo "已推送 $TODAY 的数据"
