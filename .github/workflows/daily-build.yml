name: Daily 60s Build

on:
  push:
    branches: [main]
  schedule:
    # 只在数据更新的时间段内轮询：北京时间 06:00–12:40，每 20 分钟一次。
    # 每次先检测当天数据是否已生成：已生成则当天跳过，未生成则继续下一轮，其余时间不触发。
    # 注意：cron 的小时范围必须递增，跨零点要拆成两条。
    - cron: '*/20 22-23 * * *'   # 北京时间 06:00–07:40
    - cron: '*/20 0-4 * * *'     # 北京时间 08:00–12:40
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个构建，避免定时任务与手动触发互相覆盖
concurrency:
  group: daily-60s-build
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check today's data status
        id: date_check
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          BUILT=$(cat data-date.txt 2>/dev/null | tr -d '\r\n ' || true)
          echo "today_bjt=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "$BUILT" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今日（$TODAY）数据已生成，跳过构建"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "当前数据日期: ${BUILT:-none}，需要构建 $TODAY"
          fi

      - name: Setup Python
        if: steps.date_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (Chrome headless + Chinese fonts)
        if: steps.date_check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libgbm1 libnss3 libatk-bridge2.0-0 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 fonts-noto-cjk 2>&1 | tail -5

      - name: Install Python dependencies
        if: steps.date_check.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts selenium webdriver-manager Pillow

      - name: Setup Chrome
        if: steps.date_check.outputs.skip != 'true'
        uses: browser-actions/setup-chrome@v1

      - name: Run 60s pipeline (RSS + TTS + WebP)
        id: build
        if: steps.date_check.outputs.skip != 'true'
        run: |
          echo "=== 执行每日构建 $(TZ='Asia/Shanghai' date '+%F %T %Z') ==="
          set +e
          python sixty_seconds_daily.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          if [ "$code" -eq 3 ]; then
            # 还没拿到今天的数据：不算失败，下一轮继续轮询
            echo "::notice::还没有拿到今天的数据，等待下一次轮询"
            exit 0
          fi

          if [ "$code" -ne 0 ]; then
            echo "::error::构建脚本失败，退出码 $code"
            exit "$code"
          fi

          echo "=== XML 内容预览 ==="
          head -12 zhihu_daily_news.xml

      - name: Verify today's data
        if: steps.date_check.outputs.skip != 'true' && steps.build.outputs.exit_code == '0'
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          BUILT=$(cat data-date.txt 2>/dev/null || echo none)
          echo "数据日期: $BUILT / 今天: $TODAY"
          if [ "$BUILT" != "$TODAY" ]; then
            echo "::error::构建结果不是今日数据（$BUILT），拒绝提交"
            exit 1
          fi
          for f in 60s.mp3 60s.webp 60s.html index.html; do
            if [ ! -s "$f" ]; then
              echo "::error::缺少产物文件 $f"
              exit 1
            fi
          done

      - name: Commit and push changes
        if: steps.date_check.outputs.skip != 'true' && steps.build.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f zhihu_daily_news.xml data-date.txt 60s.mp3 60s.webp 60s.html index.html

          if git diff --staged --quiet; then
            echo "内容无变化，无需提交"
            exit 0
          fi

          TODAY=$(TZ='Asia/Shanghai' date +'%F %H:%M')
          git commit -m "Daily build: $TODAY [skip ci]"
          git pull --rebase --autostash origin main
          git push
          echo "已推送 $TODAY 的数据"

      # 站点经 Cloudflare 代理，HTML 默认被缓存 30 分钟（max-age=1800）。
      # 配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID 后，这里会主动清理首页缓存，做到分钟级生效。
      - name: Purge Cloudflare cache (optional)
        if: steps.date_check.outputs.skip != 'true' && steps.build.outputs.exit_code == '0'
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID，跳过 CDN 缓存清理"
            exit 0
          fi
          DOMAIN=$(cat CNAME 2>/dev/null | tr -d '\r\n ')
          echo "等待 GitHub Pages 部署生效（60s）..."
          sleep 60
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[\"https://$DOMAIN/\",\"https://$DOMAIN/index.html\"]}" | head -c 500
          echo
